services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: multi-agent-rag-postgres
    environment:
      POSTGRES_DB: multi_agent_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multi_agent_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
